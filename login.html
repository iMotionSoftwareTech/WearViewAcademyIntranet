<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WearView Academy Intranet</title>
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="js/site.js"></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><i class="fa-solid fa-school"></i></a>
            <h1>WearView Academy</h1>
        </div>
        <div class="profile">
            <a href="login.html"><i class="fa-regular fa-user"></i></a>
        </div>
    </header>
    <nav>
        <ul>
            <li class="active"><a href="index.html">Home</a></li>
            <li><a href="login.html">Report Issue</a></li>
            <li><a href="login.html">View Jobs</a></li>
        </ul>
    </nav>
    <main>
        <section class="login-section">
            <div class="login-container">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="formMarginSplit">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                    <div class="formMarginSplit">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-submit" 
                    onclick="initiateLogin(document.getElementById('username').value, 
                    document.getElementById('password').value)">Login</button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <div>
            <h4>About</h4>
            <p>WearView Academy is a secondary school committed to excellence and student wellbeing.</p>
        </div>
    <div>
        <h4>Quick Links</h4>
        <a href="#">Policies</a>
        <a href="#">Privacy</a>
        <a href="#">Contact Us</a>
    </div>
        <div>
            <h4>Contact</h4>
            <p>info@wearview.ac.uk</p>
            <p>(0121) 555 0147</p>
        </div>
    </footer>
    <div class="copyright">
        © 2026 WearView Academy. All rights reserved.
    </div>

</body>
</html>
